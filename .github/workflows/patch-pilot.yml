# .github/workflows/patch-pilot.yml

name: Patch Pilot AI Remediation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: patch-pilot-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm i

      - run: npm audit --json > audit.json
        continue-on-error: true

      - run: node .github/scripts/patch-pilot.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}